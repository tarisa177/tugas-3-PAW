
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Form Pendaftaran Mahasiswa</h1>
        <p>Silakan isi data diri lengkap</p>
    </header>

    <main class="container">
        <div class="card">
            <h2>Data Pendaftar</h2>

            <form action="detail.html" method="GET">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim"
                           placeholder="Masukkan NIM" required>
                </div>

                <div class="form-group">
                    <label for="tempat">Tempat Lahir</label>
                    <input type="text" id="tempat" name="tempat"
                           placeholder="Contoh: Padang Panjang" required>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Lahir</label>
                    <input type="date" id="tanggal" name="tanggal" required>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <div class="pilihan">
                        <label>
                            <input type="radio" name="jk"
                                   value="Laki-laki" required>
                            Laki-laki
                        </label>

                        <label>
                            <input type="radio" name="jk"
                                   value="Perempuan">
                            Perempuan
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Masukkan email aktif" required>
                </div>

                
                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <input type="text" id="prodi" name="prodi"
                             placeholder="Masukkan program studi kamu" required>
                </div>


                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" name="alamat" rows="3"
                              placeholder="Masukkan alamat lengkap"
                              required></textarea>
                </div>

                <button type="submit">Tampilkan Data</button>
            </form>
        </div>
    </main>

    
<!-- Catatan contoh query string -->
        <div class="catatan-query">
            <h3>Catatan Query String</h3>
            <p>
                Query string adalah data yang dikirim melalui URL
                menggunakan method GET.
            </p>

            <p>Contoh format URL:</p>
            <code>
                detail.html?nama=Tarisa&amp;nim=124140039&amp;prodi=PAW
            </code>

        </div>


    <footer>
        <p>Pemrograman Aplikasi Web</p>
    </footer>

</body>
</html>
